name: Handle Unsubscribe Request

on:
  issues:
    types: [closed]

jobs:
  process-unsubscribe:
    if: github.event.issue.state == 'closed' && (contains(github.event.issue.labels.*.name, 'unsubscribe') || startsWith(github.event.issue.title, '[Unsubscribe]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Process unsubscribe
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          BLOG_NAME: ${{ secrets.BLOG_NAME }}
          BLOG_URL: ${{ secrets.BLOG_URL }}
          REPO_NAME: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python src/unsubscribe_handler.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --staged --quiet || git commit -m "Update subscriber list - unsubscribe"
          git push
